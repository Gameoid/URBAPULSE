<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbaPulse | Better Maps</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Fallback CSS variables in case css/style.css is missing */
        :root {
            --bg: #0b0f19;
            --surface: #151c2c;
            --border: #2a3441;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #00d2ff;
            --danger: #ff4b2b;
            --success: #27ae60;
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        nav {
            height: 70px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .maps-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 70px);
        }

        .search-panel {
            padding: 30px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--bg);
            overflow-y: auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-group input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.9rem;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            /* Optional: slight dark-mode tint to match your UI theme */
            filter: invert(90%) hue-rotate(180deg) contrast(95%);
        }

        .route-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            cursor: pointer;
            transition: var(--transition);
        }

        .route-card.hot { border-left-color: var(--danger); opacity: 0.85; }
        .route-card.safe { border-left-color: var(--success); }
        .route-card:hover { transform: scale(1.02); opacity: 1; }

        .legend-overlay {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.92);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text);
            backdrop-filter: blur(6px);
        }

        .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
        .legend-item:last-child { margin-bottom: 0; }
        .color-box { width: 12px; height: 12px; margin-right: 10px; border-radius: 2px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo" style="text-decoration: none;">URBAPULSE</a>
        <div style="color: var(--text-muted); font-size: 0.8rem;">BETTER MAPS: WEIGHTED NAVIGATION</div>
    </nav>

    <main class="maps-layout">
        <aside class="search-panel">
            <h2 style="margin: 0; font-size: 1.4rem;">Route Planning</h2>
            
            <div class="form-group" style="margin-top: 10px;">
                <label>Origin</label>
                <input type="text" value="Sec-17 Metro Station" readonly>
            </div>
            <div class="form-group">
                <label>Destination</label>
                <input type="text" value="Sector 17 Market Hub" readonly>
            </div>

            <hr style="border: 0.5px solid var(--border); width: 100%;">

            <div id="route-options">
                <div class="route-card hot" onclick="updateMap('shortest')">
                    <h4 style="margin: 0;">Shortest Path (Fast)</h4>
                    <p style="font-size: 0.8rem; color: var(--danger); margin: 8px 0 0;">Exposure: 44°C | AQI: 195</p>
                </div>
                
                <div class="route-card safe" style="margin-top: 15px;" onclick="updateMap('health')">
                    <h4 style="margin: 0;">Health Gradient (Rec.)</h4>
                    <p style="font-size: 0.8rem; color: var(--success); margin: 8px 0 4px;">Exposure: 38°C | AQI: 110</p>
                    <small style="color: var(--text-muted);">+2 mins walk via Shaded Corridor</small>
                </div>
            </div>
        </aside>

        <section class="map-container">
            <!-- Working Google Maps Embed from your second file (Sector 17, Faridabad) -->
            <iframe 
                id="gmap-frame"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7004.457704442871!2d77.30727912814038!3d28.38730557996039!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cdc43d495d1f7%3A0xdfb2b27b63173bb5!2sMVN%20School%20Sector%2017!5e0!3m2!1sen!2sin!4v1699366814583!5m2!1sen!2sin"
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            
            <div class="legend-overlay">
                <div class="legend-item"><div class="color-box" style="background: var(--danger);"></div> High Heat/AQI Zone</div>
                <div class="legend-item"><div class="color-box" style="background: var(--success);"></div> Cooled/Shaded Path</div>
                <div class="legend-item"><div class="color-box" style="background: var(--accent);"></div> Standard Route</div>
            </div>
        </section>
    </main>

    <script>
        // Optional interactivity when clicking the route cards on the left
        function updateMap(type) {
            const frame = document.getElementById('gmap-frame');
            if (type === 'shortest') {
                // Centers on Sector 17 Main Road area
                frame.src = "https://www.google.com/maps?q=28.4089,77.3178&z=15&output=embed";
            } else {
                // Centers on Sector 17 Shaded / Institutional Zone
                frame.src = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7004.457704442871!2d77.30727912814038!3d28.38730557996039!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cdc43d495d1f7%3A0xdfb2b27b63173bb5!2sMVN%20School%20Sector%2017!5e0!3m2!1sen!2sin!4v1699366814583!5m2!1sen!2sin";
            }
        }
    </script>
</body>
</html>
