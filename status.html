<script>
        const BLYNK_TOKEN = "CKoY_lFmYduxAk27b24SPN-6FG5K-Peq";
        const BLYNK_URL = `https://blr1.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v0&v1&v2`;

        async function fetchLiveTelemetry() {
            try {
                const res = await fetch(BLYNK_URL);
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();

                const temp = parseFloat(data.v0);
                const hum  = parseFloat(data.v1);
                const aqi  = parseInt(data.v2, 10);

                if (!isNaN(temp)) {
                    document.getElementById("temp-val").innerText = temp.toFixed(1);
                    const tempTag  = document.getElementById("temp-tag");
                    const tempNote = document.getElementById("temp-note");
                    if (temp >= 38) {
                        tempTag.innerText = "Critical";
                        tempTag.className = "status-tag tag-danger";
                        tempNote.innerText = "Triggering Misting Sprinklers...";
                    } else {
                        tempTag.innerText = "Safe";
                        tempTag.className = "status-tag tag-safe";
                        tempNote.innerText = "Ambient Thermal State: Normal";
                    }
                }

                if (!isNaN(hum)) {
                    document.getElementById("hum-val").innerText = Math.round(hum);
                }

                if (!isNaN(aqi)) {
                    document.getElementById("aqi-val").innerText = aqi;
                    const ppm = Math.round(350 + (aqi * 1.4));
                    document.getElementById("ppm-val").innerText = ppm;

                    const aqiTag = document.getElementById("aqi-tag");
                    if (aqi > 150) {
                        aqiTag.innerText = "Poor";
                        aqiTag.className = "status-tag tag-danger";
                    } else {
                        aqiTag.innerText = "Good";
                        aqiTag.className = "status-tag tag-safe";
                    }
                }

                document.getElementById("time").innerText = new Date().toLocaleTimeString();
            } catch (err) {
                console.log("Waiting for Blynk Cloud stream...", err);
            }
        }

        setInterval(fetchLiveTelemetry, 2000);
        fetchLiveTelemetry();
    </script>
