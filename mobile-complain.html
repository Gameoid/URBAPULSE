<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UrbaPulse | Mobile Report</title>
    <style>
        /* MOBILE-FIRST NATIVE APP STYLING */
        :root {
            --bg-color: #05050a;
            --surface: #12141d;
            --accent: #00d2ff;
            --border: #2a2d3a;
            --text-muted: #8b8e98;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: white;
            /* Ensures it takes up exactly the phone screen height */
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
        }

        /* App Header */
        .app-header {
            background-color: rgba(18, 20, 29, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        /* Form Container */
        .mobile-container {
            padding: 25px 20px;
            flex-grow: 1;
        }

        .mobile-container h2 {
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .mobile-container p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Big touch-friendly inputs */
        input, select, textarea {
            width: 100%;
            box-sizing: border-box; /* Keeps padding inside the width */
            padding: 16px;
            background: #0b0f19;
            border: 2px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            -webkit-appearance: none; /* Removes default iOS styling */
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: #12141d;
        }

        /* Massive thumb-friendly button */
        .submit-btn {
            background: var(--accent);
            color: #000;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>URBAPULSE</h1>
    </div>

    <div class="mobile-container">
        <h2>Report Issue</h2>
        <p>Your report will be sent directly to the MCF Live Dashboard.</p>

        <form id="mobileCivicForm" onsubmit="submitMobileReport(event)">
            
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="mobLocation" placeholder="Sector, Landmark, etc." required>
            </div>

            <div class="form-group">
                <label>Issue Category</label>
                <select id="mobType" required>
                    <option value="" disabled selected>Tap to select...</option>
                    <option value="High Surface Temperature">High Surface Temperature</option>
                    <option value="Poor Air Quality">Poor Air Quality / Smog</option>
                    <option value="Damaged Infrastructure">Damaged Infrastructure</option>
                    <option value="Water Pump Failure">Water Pump Failure</option>
                </select>
            </div>

            <div class="form-group">
                <label>Details</label>
                <textarea id="mobDesc" rows="4" placeholder="Briefly describe what you see..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Report 🚀</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmUH2z_Dy8Dpclydl3LAKtlyTBdLCSkmc",
            authDomain: "urbapulse-dbms.firebaseapp.com",
            databaseURL: "https://urbapulse-dbms-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "urbapulse-dbms",
            storageBucket: "urbapulse-dbms.firebasestorage.app",
            messagingSenderId: "1007127344295",
            appId: "1:1007127344295:web:b6cb9727a905e8dc205782"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.submitMobileReport = function(event) {
            event.preventDefault(); 

            // Change button text to show it's working
            const btn = document.querySelector('.submit-btn');
            btn.innerHTML = "Sending...";
            btn.style.opacity = "0.7";

            const location = document.getElementById('mobLocation').value;
            const type = document.getElementById('mobType').value;
            const desc = document.getElementById('mobDesc').value;
            const date = new Date().toLocaleString();

            const finalTitle = type + " - " + location;

            const reportsListRef = ref(db, 'reports');
            const newReportRef = push(reportsListRef); 
            
            set(newReportRef, {
                title: finalTitle,
                desc: desc,
                date: date
            }).then(() => {
                alert("✅ Report Transmitted!");
                document.getElementById('mobileCivicForm').reset(); 
                
                // Reset button
                btn.innerHTML = "Send Report 🚀";
                btn.style.opacity = "1";
            }).catch((error) => {
                alert("Error: " + error);
                btn.innerHTML = "Send Report 🚀";
                btn.style.opacity = "1";
            });
        }
    </script>
</body>
</html>
