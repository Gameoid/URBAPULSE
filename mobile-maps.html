<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UrbaPulse | Mobile Routing</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --accent: #00d2ff;
            --danger: #ff4d4d;
            --safe: #00e676;
            --surface: rgba(18, 20, 29, 0.95);
            --bg-color: #0b0f19;
            --text-muted: #8b8e98;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }

        /* --- THE REAL LEAFLET MAP CONTAINER --- */
        #mobile-map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1; /* Map stays in the back */
        }

        /* Hide the leaflet zoom buttons on mobile for a cleaner look */
        .leaflet-control-zoom { display: none !important; }

        /* Custom pulsing dot for current location */
        .pulse-marker {
            background: var(--accent);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }

        /* --- COMPACT TOP SEARCH --- */
        .top-search-card {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            background: var(--surface);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 15px;
            z-index: 10; /* Floats over map */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .input-row { display: flex; align-items: center; margin-bottom: 6px; }
        .input-row:last-child { margin-bottom: 0; }
        .input-icon { width: 20px; text-align: center; font-size: 10px; color: var(--accent); margin-right: 8px; }
        .input-field {
            flex-grow: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 12px; border-radius: 6px; color: white; font-size: 0.85rem; outline: none;
        }

        /* --- ULTRA-COMPACT BOTTOM SHEET --- */
        #bottom-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 20px 20px 0 0;
            padding: 15px 15px 20px 15px;
            z-index: 100; /* Floats over map */
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .handle { width: 35px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: 0 auto 12px; }

        /* Route Cards */
        .route-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden;
        }
        .route-card.selected { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
        .card-indicator { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
        .card-danger { background: var(--danger); }
        .card-safe { background: var(--safe); }
        .route-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .route-title { font-weight: bold; font-size: 0.95rem; }
        .route-time { font-size: 1.05rem; font-weight: 800; }
        .route-stats { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 12px; }
        .stat-danger { color: var(--danger); }
        .stat-safe { color: var(--safe); }
        .route-desc { font-size: 0.7rem; color: var(--safe); margin-top: 6px; background: rgba(0, 230, 118, 0.1); padding: 4px 8px; border-radius: 4px; display: inline-block; }

        .nav-btn {
            background: var(--accent); color: black; border: none; width: 100%; padding: 12px;
            border-radius: 10px; font-weight: 800; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="mobile-map"></div>

    <div class="top-search-card">
        <div class="input-row">
            <div class="input-icon">⚪</div>
            <input type="text" class="input-field" value="Sec-17 Metro Station" readonly>
        </div>
        <div class="input-row">
            <div class="input-icon" style="color: var(--danger);">📍</div>
            <input type="text" class="input-field" value="Sector 17 Market Hub" readonly>
        </div>
    </div>

    <div id="bottom-sheet">
        <div class="handle"></div>
        
        <div class="route-card" id="card-fast" onclick="selectRoute('fast')">
            <div class="card-indicator card-danger"></div>
            <div class="route-header">
                <div class="route-title">Shortest Path (Fast)</div>
                <div class="route-time stat-danger">12 min</div>
            </div>
            <div class="route-stats">
                <div>Exposure: <span class="stat-danger">44°C</span></div>
                <div>AQI: <span class="stat-danger">195</span></div>
            </div>
        </div>

        <div class="route-card selected" id="card-health" onclick="selectRoute('health')">
            <div class="card-indicator card-safe"></div>
            <div class="route-header">
                <div class="route-title">Health Gradient (Rec.)</div>
                <div class="route-time stat-safe">14 min</div>
            </div>
            <div class="route-stats">
                <div>Exposure: <span class="stat-safe">38°C</span></div>
                <div>AQI: <span class="stat-safe">110</span></div>
            </div>
            <div class="route-desc">+2 mins via Shaded Corridor</div>
        </div>

        <button class="nav-btn" onclick="startNavigation()">Start Navigation</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered near Faridabad Sec 17
        var map = L.map('mobile-map', { zoomControl: false }).setView([28.4024, 77.3181], 15);

        // Add CartoDB Light tiles (matches your desktop screenshot perfectly)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        // --- MAP ROUTE COORDINATES ---
        var startPoint = [28.3960, 77.3150]; // Bottom Left (Origin)
        var endPoint = [28.4060, 77.3220];   // Bottom Right (Destination)
        var detourPoint = [28.4090, 77.3160]; // Top Left (The Safe Detour)

        // Draw Shortest Path (Red Dashed)
        var fastRoute = L.polyline([startPoint, endPoint], {
            color: '#ff4d4d',
            weight: 4,
            dashArray: '10, 10',
            opacity: 0.4 // Starts dimmed
        }).addTo(map);

        // Draw Health Gradient (Green Solid)
        var healthRoute = L.polyline([startPoint, detourPoint, endPoint], {
            color: '#00e676',
            weight: 6,
            opacity: 1 // Starts active
        }).addTo(map);

        // Add User Location Dot (Cyan)
        var userIcon = L.divIcon({ className: 'pulse-marker', iconSize: [16, 16] });
        L.marker([28.4010, 77.3180], { icon: userIcon }).addTo(map);

        // Zoom map to fit both routes perfectly
        map.fitBounds(healthRoute.getBounds(), { paddingBottomRight: [0, 250] });

        // --- UI INTERACTION LOGIC ---
        function selectRoute(type) {
            // Reset UI Cards
            document.getElementById('card-fast').classList.remove('selected');
            document.getElementById('card-health').classList.remove('selected');

            // Switch Map Lines
            if(type === 'fast') {
                document.getElementById('card-fast').classList.add('selected');
                fastRoute.setStyle({ weight: 6, opacity: 1 });
                healthRoute.setStyle({ weight: 4, opacity: 0.4 });
            } else {
                document.getElementById('card-health').classList.add('selected');
                fastRoute.setStyle({ weight: 4, opacity: 0.4 });
                healthRoute.setStyle({ weight: 6, opacity: 1 });
            }
        }

        function startNavigation() {
            const btn = document.querySelector('.nav-btn');
            btn.innerHTML = "Rerouting...";
            setTimeout(() => {
                alert("Simulating connection to Health-Gradient Navigation API...");
                btn.innerHTML = "Start Navigation";
            }, 800);
        }
    </script>
</body>
</html>
