<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UrbaPulse | Mobile Routing</title>
    <style>
        :root {
            --accent: #00d2ff;
            --danger: #ff4d4d;
            --safe: #00e676;
            --surface: rgba(18, 20, 29, 0.95);
            --bg-color: #05050a;
            --text-muted: #8b8e98;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }

        /* --- THE MAP BASE --- */
        #mobile-map {
            width: 100vw;
            height: 100vh;
            /* Replace with your actual map image if needed */
            background-image: url('media/photos/BG.png'); 
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* --- SVG ROUTE OVERLAYS --- */
        .route-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; /* Lets clicks pass through to map */
            z-index: 5;
        }

        .route-path {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.3;
            transition: opacity 0.3s, stroke-width 0.3s;
        }

        .route-path.active {
            opacity: 1;
            stroke-width: 8;
            filter: drop-shadow(0 0 8px currentColor);
            animation: dash-flow 2s linear infinite;
        }

        .path-danger { stroke: var(--danger); stroke-dasharray: 10 15; }
        .path-safe { stroke: var(--safe); }

        @keyframes dash-flow {
            to { stroke-dashoffset: -50; }
        }

        /* Node Pin */
        .map-pin {
            position: absolute;
            width: 16px; height: 16px;
            background: var(--accent);
            border-radius: 50%;
            top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.3);
            z-index: 6;
        }

        /* --- FLOATING TOP SEARCH CARD --- */
        .top-search-card {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            background: var(--surface);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 15px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-row:last-child { margin-bottom: 0; }

        .input-icon {
            width: 20px; text-align: center;
            font-size: 12px; color: var(--accent);
            margin-right: 10px;
        }

        .input-field {
            flex-grow: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .input-field:focus { border-color: var(--accent); }

        /* --- BOTTOM SHEET --- */
        #bottom-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .handle {
            width: 40px; height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin: 0 auto 20px;
        }

        /* Route Option Cards */
        .route-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .route-card.selected {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .card-indicator {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 5px;
        }

        .card-danger { background: var(--danger); }
        .card-safe { background: var(--safe); }

        .route-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }

        .route-title { font-weight: bold; font-size: 1.1rem; }
        .route-time { font-size: 1.2rem; font-weight: 800; }

        .route-stats {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex; gap: 15px;
        }

        .stat-highlight { color: white; font-weight: bold; }
        .stat-danger { color: var(--danger); }
        .stat-safe { color: var(--safe); }

        .route-desc {
            font-size: 0.8rem;
            color: var(--safe);
            margin-top: 8px;
            background: rgba(0, 230, 118, 0.1);
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        .nav-btn {
            background: var(--accent);
            color: black;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
        }
    </style>
</head>
<body>

    <div id="mobile-map">
        
        <svg class="route-layer" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path id="path-fast" class="route-path path-danger" d="M 30,70 L 70,30" />
            
            <path id="path-health" class="route-path path-safe active" d="M 30,70 L 40,40 L 70,30" />
        </svg>

        <div class="map-pin"></div>

        <div class="top-search-card">
            <div class="input-row">
                <div class="input-icon">⚪</div>
                <input type="text" class="input-field" value="Sec-17 Metro Station" readonly>
            </div>
            <div class="input-row">
                <div class="input-icon" style="color: var(--danger);">📍</div>
                <input type="text" class="input-field" value="Sector 17 Market Hub" readonly>
            </div>
        </div>
    </div>

    <div id="bottom-sheet">
        <div class="handle"></div>
        
        <div class="route-card" id="card-fast" onclick="selectRoute('fast')">
            <div class="card-indicator card-danger"></div>
            <div class="route-header">
                <div class="route-title">Shortest Path (Fast)</div>
                <div class="route-time stat-danger">12 min</div>
            </div>
            <div class="route-stats">
                <div>Exposure: <span class="stat-danger">44°C</span></div>
                <div>AQI: <span class="stat-danger">195</span></div>
            </div>
        </div>

        <div class="route-card selected" id="card-health" onclick="selectRoute('health')">
            <div class="card-indicator card-safe"></div>
            <div class="route-header">
                <div class="route-title">Health Gradient (Rec.)</div>
                <div class="route-time stat-safe">14 min</div>
            </div>
            <div class="route-stats">
                <div>Exposure: <span class="stat-safe">38°C</span></div>
                <div>AQI: <span class="stat-safe">110</span></div>
            </div>
            <div class="route-desc">+2 mins via Shaded Corridor</div>
        </div>

        <button class="nav-btn" onclick="startNavigation()">Start Navigation</button>
    </div>

    <script>
        function selectRoute(type) {
            // Reset styles
            document.getElementById('card-fast').classList.remove('selected');
            document.getElementById('card-health').classList.remove('selected');
            document.getElementById('path-fast').classList.remove('active');
            document.getElementById('path-health').classList.remove('active');

            // Apply active styles
            if(type === 'fast') {
                document.getElementById('card-fast').classList.add('selected');
                document.getElementById('path-fast').classList.add('active');
            } else {
                document.getElementById('card-health').classList.add('selected');
                document.getElementById('path-health').classList.add('active');
            }
        }

        function startNavigation() {
            const btn = document.querySelector('.nav-btn');
            btn.innerHTML = "Rerouting...";
            setTimeout(() => {
                alert("Simulating connection to Health-Gradient Navigation API...");
                btn.innerHTML = "Start Navigation";
            }, 800);
        }
    </script>
</body>
</html>
