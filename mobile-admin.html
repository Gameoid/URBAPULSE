<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UrbaPulse | Mobile Admin</title>
    <style>
        /* MOBILE-FIRST NATIVE APP STYLING */
        :root {
            --bg-color: #05050a;
            --surface: #12141d;
            --accent: #00d2ff;
            --border: #2a2d3a;
            --text-muted: #8b8e98;
            --danger: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: white;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
        }

        /* App Header */
        .app-header {
            background-color: rgba(18, 20, 29, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .lock-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            display: none; /* Hidden until logged in */
        }

        /* PIN Screen */
        #mobile-pin-screen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .pin-container {
            display: flex;
            gap: 10px;
            margin: 30px 0;
        }

        .pin-box {
            width: 50px; 
            height: 60px; 
            font-size: 30px; 
            text-align: center; 
            background: #0b0f19; 
            border: 2px solid var(--border); 
            color: white; 
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
            /* inputmode="numeric" forces the number pad to open on phones! */
        }

        .pin-box:focus {
            border-color: var(--accent);
            background: var(--surface);
        }

        /* Dashboard Screen */
        #mobile-dashboard {
            display: none; /* Hidden until PIN is correct */
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .report-card {
            background: var(--surface);
            border-left: 4px solid var(--danger);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .report-card h3 {
            margin: 0 0 8px 0;
            color: var(--danger);
            font-size: 1.2rem;
        }

        .report-card p {
            color: #ccc;
            font-size: 0.95rem;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .report-card .date {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 15px;
        }

        .resolve-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .resolve-btn:active {
            background: rgba(0, 210, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>ADMIN VAULT</h1>
        <button id="lockBtn" class="lock-btn" onclick="lockApp()">LOCK</button>
    </div>

    <div id="mobile-pin-screen">
        <h2 style="margin:0; color: var(--accent);">Authentication</h2>
        <p style="color: var(--text-muted); font-size:0.9rem;">Enter Municipal Override PIN</p>
        
        <div class="pin-container">
            <input type="password" class="pin-box" inputmode="numeric" maxlength="1" onkeyup="moveToNext(this, event, 1)" id="pin1">
            <input type="password" class="pin-box" inputmode="numeric" maxlength="1" onkeyup="moveToNext(this, event, 2)" id="pin2">
            <input type="password" class="pin-box" inputmode="numeric" maxlength="1" onkeyup="moveToNext(this, event, 3)" id="pin3">
            <input type="password" class="pin-box" inputmode="numeric" maxlength="1" onkeyup="moveToNext(this, event, 4)" id="pin4">
        </div>
        
        <p id="pin-error" style="color: var(--danger); opacity: 0; font-weight: bold; margin:0;">❌ Invalid Credentials</p>
    </div>

    <div id="mobile-dashboard">
        <div id="reportList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Your exact Firebase keys
        const firebaseConfig = {
            apiKey: "AIzaSyAmUH2z_Dy8Dpclydl3LAKtlyTBdLCSkmc",
            authDomain: "urbapulse-dbms.firebaseapp.com",
            databaseURL: "https://urbapulse-dbms-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "urbapulse-dbms",
            storageBucket: "urbapulse-dbms.firebasestorage.app",
            messagingSenderId: "1007127344295",
            appId: "1:1007127344295:web:b6cb9727a905e8dc205782"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const reportsRef = ref(db, 'reports');

        // --- PIN LOGIC ---
        window.moveToNext = function(currentInput, event, index) {
            if (event.key === 'Backspace' && index > 1) {
                document.getElementById('pin' + (index - 1)).focus();
                return;
            }
            if (currentInput.value.length === 1 && index < 4) {
                document.getElementById('pin' + (index + 1)).focus();
            }
            if (index === 4 && currentInput.value.length === 1) {
                verifyPin();
            }
        }

        function verifyPin() {
            const enteredPin = document.getElementById('pin1').value + 
                               document.getElementById('pin2').value + 
                               document.getElementById('pin3').value + 
                               document.getElementById('pin4').value;

            if (enteredPin === "1983") {
                // SUCCESS! 
                document.getElementById('mobile-pin-screen').style.display = 'none';
                document.getElementById('mobile-dashboard').style.display = 'block';
                document.getElementById('lockBtn').style.display = 'block';
                // Close mobile keyboard
                document.activeElement.blur(); 
            } else {
                // FAIL
                document.getElementById('pin-error').style.opacity = '1';
                setTimeout(() => { document.getElementById('pin-error').style.opacity = '0'; }, 2000);
                for(let i=1; i<=4; i++) { document.getElementById('pin' + i).value = ''; }
                document.getElementById('pin1').focus();
            }
        }

        window.lockApp = function() {
            document.getElementById('mobile-dashboard').style.display = 'none';
            document.getElementById('lockBtn').style.display = 'none';
            document.getElementById('mobile-pin-screen').style.display = 'flex';
            for(let i=1; i<=4; i++) { document.getElementById('pin' + i).value = ''; }
        }

        // --- FIREBASE LIVE FETCHING ---
        onValue(reportsRef, (snapshot) => {
            const reportList = document.getElementById('reportList');
            const data = snapshot.val();

            if (!data) {
                reportList.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; background: rgba(0,255,0,0.05); border: 1px dashed rgba(0,255,0,0.3); border-radius: 12px; margin-top: 20px;">
                        <h3 style="color: #00e676; margin: 0; font-size: 1.2rem;">✅ Operations Normal</h3>
                        <p style="color: gray; margin-top: 10px; font-size: 0.9rem;">No anomalous reports active.</p>
                    </div>`;
                return;
            }

            let html = "";
            for (let id in data) {
                let report = data[id];
                html += `
                    <div class="report-card">
                        <h3>⚠️ ${report.title}</h3>
                        <p>${report.desc}</p>
                        <span class="date">${report.date}</span>
                        <button class="resolve-btn" onclick="resolveReport('${id}')">Resolve Ticket</button>
                    </div>
                `;
            }
            reportList.innerHTML = html;
        });

        // --- DELETE REPORT LOGIC ---
        window.resolveReport = function(idToRemove) {
            const exactReportRef = ref(db, 'reports/' + idToRemove);
            remove(exactReportRef)
                .then(() => console.log("Report Resolved from Mobile!"))
                .catch((error) => alert("Error removing report: " + error));
        }
    </script>
</body>
</html>
