name: Build URBAPULSE Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare www folder and Capacitor config
        run: |
          mkdir -p www
          cp -r *.html css js media www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.urbapulse.app",
            "appName": "URBAPULSE",
            "webDir": "www",
            "server": {
              "androidScheme": "http",
              "cleartext": true
            }
          }
          EOF

      - name: Install Capacitor & Build Android Project
        run: |
          npm install
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: URBAPULSE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
