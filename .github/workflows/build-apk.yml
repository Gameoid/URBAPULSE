name: Build URBAPULSE Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare www folder, Fix Zoom & Auto-Rotate CSS
        run: |
          mkdir -p www
          cp -r *.html css js media www/ 2>/dev/null || true

          python3 - << 'PYEOF'
          import glob, re

          fix_css = """
          <style id="mobile-fit-fix">
            *, *::before, *::after { box-sizing: border-box !important; }
            html, body {
              width: 100% !important;
              max-width: 100vw !important;
              overflow-x: hidden !important;
              margin: 0 !important;
              -webkit-text-size-adjust: 100% !important;
            }
            @media (max-width: 900px) {
              html { font-size: 14px !important; }
              nav {
                padding: 12px 14px !important;
                flex-wrap: wrap !important;
                gap: 8px !important;
              }
              .container {
                width: 100% !important;
                max-width: 100vw !important;
                padding: 16px 14px !important;
              }
              h1 { font-size: 1.8rem !important; }
              h2 { font-size: 1.4rem !important; }
              .status-header {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 6px !important;
                margin-bottom: 16px !important;
              }
              .data-grid {
                grid-template-columns: 1fr !important;
                gap: 12px !important;
              }
              .metric-card { padding: 18px 16px !important; }
              .metric-value { font-size: 2.2rem !important; }
              .maps-layout, .model-layout {
                grid-template-columns: 1fr !important;
                height: auto !important;
                gap: 14px !important;
              }
              .search-panel, .anatomy-list {
                width: 100% !important;
                padding: 14px !important;
                border-right: none !important;
              }
              #map { height: 50vh !important; min-height: 280px !important; }
              img, iframe, canvas, table { max-width: 100% !important; height: auto !important; }
            }
          </style>
          """

          for path in glob.glob("www/*.html"):
              with open(path, "r", encoding="utf-8") as f:
                  html = f.read()
              html = re.sub(
                  r'<meta\s+name=["\']viewport["\'][^>]*>',
                  '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">',
                  html,
                  flags=re.IGNORECASE,
              )
              if "</head>" in html:
                  html = html.replace("</head>", fix_css + "\n</head>", 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(html)
          PYEOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.urbapulse.app",
            "appName": "URBAPULSE",
            "webDir": "www",
            "server": {
              "androidScheme": "http",
              "cleartext": true
            }
          }
          EOF

      - name: Install Capacitor & Build Android Project
        run: |
          npm install
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="fullSensor"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: URBAPULSE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
